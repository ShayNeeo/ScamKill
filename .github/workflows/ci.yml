name: ScamKill CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Typecheck + Test + Landing Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install App Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck ScamKill App & API (tsrs Rust Compiler + tsc)
        run: |
          pnpm run typecheck:tsrs
          pnpm run typecheck

      - name: Run Unit & Integration Tests (273 tests)
        run: pnpm test

      - name: Install, Typecheck (tsrs) & Build Astro 6 Cloudflare Landing Page
        run: |
          pnpm --dir landing install --no-frozen-lockfile
          pnpm --dir landing run typecheck:tsrs
          pnpm --dir landing run build
